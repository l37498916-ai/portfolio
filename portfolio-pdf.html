<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品集 PDF 版</title>
    <style>
      :root {
        --ink: #12151c;
        --text: #303642;
        --muted: #737b89;
        --line: #d9e1ed;
        --blue: #3577e8;
        --wash: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 80% 0%, rgba(53, 119, 232, 0.16), transparent 34%),
          linear-gradient(135deg, #ffffff 0%, #f7f9fd 54%, #eaf1ff 100%);
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }

      .pdf-page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0 48px;
      }

      .pdf-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .pdf-eyebrow {
        margin: 0 0 8px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 64px);
        line-height: 1;
      }

      .pdf-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .pdf-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border: 1px solid rgba(53, 119, 232, 0.24);
        border-radius: 8px;
        padding: 0 15px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--blue);
        font-size: 14px;
        font-weight: 850;
        text-decoration: none;
      }

      .pdf-button.primary {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }

      .pdf-viewer {
        min-height: 74vh;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.1);
      }

      .pdf-viewer object,
      .pdf-viewer iframe {
        display: block;
        width: 100%;
        height: 74vh;
        border: 0;
      }

      .pdf-fallback {
        padding: 32px;
        color: var(--text);
        font-size: 16px;
        line-height: 1.7;
      }

      @media (max-width: 720px) {
        .pdf-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .pdf-actions {
          justify-content: flex-start;
        }

        .pdf-viewer,
        .pdf-viewer object,
        .pdf-viewer iframe {
          min-height: 70vh;
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="pdf-page">
      <header class="pdf-header">
        <div>
          <p class="pdf-eyebrow">Portfolio PDF</p>
          <h1>作品集 PDF 版</h1>
        </div>
        <nav class="pdf-actions" aria-label="PDF 操作">
          <a class="pdf-button" href="./index.html">返回作品集</a>
          <a class="pdf-button primary" href="./assets/portfolio.pdf" download>下载 PDF</a>
        </nav>
      </header>

      <section class="pdf-viewer" aria-label="作品集 PDF 预览">
        <object data="./assets/portfolio.pdf" type="application/pdf">
          <iframe src="./assets/portfolio.pdf" title="作品集 PDF 预览"></iframe>
          <div class="pdf-fallback">
            当前浏览器无法直接预览 PDF，可以点击上方“下载 PDF”查看。
          </div>
        </object>
      </section>
    </main>
  </body>
</html>
